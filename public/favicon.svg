<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Exact Footer Terminal Button Gradient: Azure 600 -> Cyan 500 -> Emerald 500 -->
    <linearGradient id="footerBtnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Top Glass Sheen Reflection -->
    <linearGradient id="topSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Ambient Outer Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0284C7" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Perfect Circle Badge with Footer Button Gradient -->
  <circle cx="128" cy="128" r="120" fill="url(#footerBtnGrad)" filter="url(#glow)" />

  <!-- Top Glass Sheen Reflection -->
  <ellipse cx="128" cy="70" rx="92" ry="46" fill="url(#topSheen)" />

  <!-- Inner Concentric Ring Accent -->
  <circle cx="128" cy="128" r="112" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="6 3" />

  <!-- Crisp Terminal Prompt Symbol >_ -->
  <path d="M 36 108 L 58 126 L 36 144" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="10" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Clean Bold Crisp White "SREng" Typography (Dot Removed) -->
  <text x="74" y="142" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-weight="900" 
        font-size="54" 
        fill="#FFFFFF" 
        letter-spacing="1">SREng</text>

  <!-- Sleek Terminal Cursor Bar Underline -->
  <rect x="76" y="156" width="32" height="6" rx="3" fill="#FFFFFF" opacity="0.9" />
</svg>
