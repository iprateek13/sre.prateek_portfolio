<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <!-- Clean White Background Card -->
  <rect width="64" height="64" rx="16" fill="#FFFFFF"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="#0284C7" stroke-width="2.5" stroke-opacity="0.9"/>
  
  <!-- Terminal Header Dots -->
  <circle cx="12" cy="12" r="2.5" fill="#F43F5E"/>
  <circle cx="20" cy="12" r="2.5" fill="#F59E0B"/>
  <circle cx="28" cy="12" r="2.5" fill="#10B981"/>

  <!-- SRE Black Typography -->
  <text x="32" y="33" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="900" font-size="18" fill="#0F172A" text-anchor="middle" letter-spacing="1">SRE</text>

  <!-- PRATEEK Black Subtext -->
  <text x="32" y="49" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="800" font-size="10.5" fill="#0284C7" text-anchor="middle" letter-spacing="0.8">PRATEEK</text>
