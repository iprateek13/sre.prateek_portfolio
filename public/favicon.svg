<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Azure & Emerald Circular Gradient Rim -->
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    
    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284C7" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Outer Circular Ring Border -->
  <circle cx="128" cy="128" r="122" fill="url(#circleGrad)" />
  
  <!-- Inner White Round Background -->
  <circle cx="128" cy="128" r="114" fill="#FFFFFF" />
  
  <!-- Inner Subtle Azure Accent Ring -->
  <circle cx="128" cy="128" r="108" fill="none" stroke="url(#circleGrad)" stroke-width="3" stroke-dasharray="8 4" opacity="0.6" />
  
  <!-- Terminal Prompt Symbol >_ -->
  <path d="M 64 96 L 86 112 L 64 128" fill="none" stroke="#0284C7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Bold Black "SRE" Main Typography -->
  <text x="136" y="126" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="900" 
        font-size="64" 
        fill="#0F172A" 
        text-anchor="middle"
        letter-spacing="2">SRE</text>

  <!-- Azure Cyan "PRATEEK" Subtitle -->
  <text x="128" y="172" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="800" 
        font-size="22" 
        fill="#0284C7" 
        text-anchor="middle"
        letter-spacing="4">PRATEEK</text>

  <!-- Bottom Accent Dot -->
  <circle cx="128" cy="192" r="4" fill="#10B981" />
</svg>
