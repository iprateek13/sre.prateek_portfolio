<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Exact Footer Terminal Button Gradient: Azure 600 -> Cyan 500 -> Emerald 500 -->
    <linearGradient id="footerBtnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Top Specular Glass Sheen Reflection -->
    <linearGradient id="topSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Ambient Outer Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0284C7" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Perfect Circle Badge with Footer Button Gradient -->
  <circle cx="128" cy="128" r="120" fill="url(#footerBtnGrad)" filter="url(#glow)" />

  <!-- Top Glass Sheen Reflection -->
  <ellipse cx="128" cy="68" rx="92" ry="46" fill="url(#topSheen)" />

  <!-- Inner Concentric Ring Accent -->
  <circle cx="128" cy="128" r="112" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.35" stroke-dasharray="6 3" />

  <!-- Perfectly Centered Composition Group (Horizontal & Vertical Center = 128, 128) -->
  <g transform="translate(2, 0)">
    <!-- Terminal Prompt Symbol >_ (Centered at Y=128) -->
    <path d="M 32 106 L 56 128 L 32 150" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="11" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Terminal Prompt Underline Cursor -->
    <rect x="32" y="162" width="22" height="6" rx="3" fill="#FFFFFF" opacity="0.9" />

    <!-- Crisp White Bold "SREng." Typography (Centered Baseline) -->
    <text x="68" y="144" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Space Grotesk', 'Segoe UI', sans-serif" 
          font-weight="900" 
          font-size="48" 
          fill="#FFFFFF" 
          letter-spacing="0.5">SREng<tspan fill="#A7F3D0">.</tspan></text>
  </g>
</svg>
