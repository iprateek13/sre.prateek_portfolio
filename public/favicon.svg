<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Azure Cyan & Emerald Mint Gradient Ring -->
    <linearGradient id="themeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Text Gradient for SREng. -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    
    <!-- Outer Glow Shadow Filter -->
    <filter id="glowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0284C7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Container Border -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#themeGrad)" filter="url(#glowShadow)" />

  <!-- Inner Dark Theme Canvas Background -->
  <rect x="14" y="14" width="228" height="228" rx="48" fill="#07090E" />

  <!-- Top Terminal Header Window Bar -->
  <path d="M 14 62 L 242 62" stroke="#1E293B" stroke-width="2" />
  
  <!-- Terminal Window Controls (Red, Amber, Green Dots) -->
  <circle cx="42" cy="38" r="8" fill="#EF4444" opacity="0.9" />
  <circle cx="64" cy="38" r="8" fill="#F59E0B" opacity="0.9" />
  <circle cx="86" cy="38" r="8" fill="#10B981" opacity="0.9" />

  <!-- Terminal Title Subtext -->
  <text x="165" y="42" 
        font-family="'JetBrains Mono', monospace, system-ui" 
        font-weight="600" 
        font-size="14" 
        fill="#0284C7" 
        text-anchor="middle"
        letter-spacing="1">~ sre-term</text>

  <!-- Glowing Terminal Prompt Symbol >_ -->
  <path d="M 40 108 L 62 126 L 40 144" 
        fill="none" 
        stroke="url(#themeGrad)" 
        stroke-width="9" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Bold Styled "SREng." Typography -->
  <text x="76" y="138" 
        font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" 
        font-weight="900" 
        font-size="52" 
        fill="url(#textGrad)" 
        letter-spacing="1">SREng<tspan fill="#10B981">.</tspan></text>

  <!-- Bottom Terminal Status Bar -->
  <rect x="40" y="174" width="176" height="32" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.5" />
  
  <!-- Status Indicator Dot -->
  <circle cx="56" cy="190" r="5" fill="#10B981" />
  
  <!-- Status Text -->
  <text x="72" y="194" 
        font-family="'JetBrains Mono', monospace" 
        font-weight="700" 
        font-size="12" 
        fill="#38BDF8">AZURE • 99.99% SLA</text>
</svg>
